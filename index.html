<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>プリント作成</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap">
<style>
/* Layout: 白い紙面に罫線だけで区切る。左に設定を上から順に、右にプリントのプレビュー。色は墨一色、赤は解答の意味でだけ。 */
:root {
  --bg: #ffffff; --ink: #000000; --sub: #3d3d3d; --faint: #6e6e6e; --rule: #d4d4d4; --soft: #f5f5f5; --red: #c8321f; --line: #b8b8b8; --ring: rgba(0,0,0,.12); --sat: #1f5fbf;
  --font: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #121212; --ink: #ffffff; --sub: #cfcfcf; --faint: #9a9a9a; --rule: #3a3a3a; --soft: #1c1c1c; --red: #ff8a7a; --line: #5a5a5a; --ring: rgba(255,255,255,.18); --sat: #8cb4ff; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #121212; --ink: #ffffff; --sub: #cfcfcf; --faint: #9a9a9a; --rule: #3a3a3a; --soft: #1c1c1c; --red: #ff8a7a; --line: #5a5a5a; --ring: rgba(255,255,255,.18); --sat: #8cb4ff; color-scheme: dark; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { touch-action: manipulation; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }  /* ダブルタップで拡大しない */
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; font-weight: 500; line-height: 1.7; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--rule); }
/* 見出し・状態・「作る」「ダウンロード」を、どの画面でも1行にならべる（ボタンの位置が変わらないように） */
.bar-in { max-width: 1320px; margin: 0 auto; display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; align-items: center; gap: 16px;
  padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.bar h1 { font-size: 1.15rem; font-weight: 900; margin: 0; letter-spacing: .06em; white-space: nowrap; }
.status { font-size: .8rem; color: var(--sub); text-align: right; line-height: 1.35; min-width: 0;
  display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; overflow: hidden; }
#save[hidden] { display: inline-block !important; visibility: hidden; }  /* まだ押せないときも場所はとっておく（「作る」が動かないように） */
/* スマホでは、状態の文字を見出しの下におき、ボタンは右に固定する */
@media (max-width: 600px) {
  .bar-in { grid-template-columns: minmax(0, 1fr) auto auto; grid-template-rows: auto auto; gap: 2px 8px; padding-block: 10px; }
  .bar h1 { grid-area: 1 / 1; font-size: 1.05rem; letter-spacing: .03em; }
  .status { grid-area: 2 / 1; text-align: left; font-size: .72rem; -webkit-line-clamp: 1; line-clamp: 1; display: block; white-space: nowrap; text-overflow: ellipsis; }
  .status.err { white-space: normal; }  /* まちがいのお知らせは省略しない */
  #make { grid-area: 1 / 2 / 3 / 3; }
  #save { grid-area: 1 / 3 / 3 / 4; }
  .bar .btn { padding: 8px 12px; }
}
@media (max-width: 350px) {
  .bar h1 { font-size: .95rem; letter-spacing: 0; }
  .bar .btn { padding: 7px 9px; }
}
.status.err { color: var(--red); }

.btn { font-weight: 700; border: 1.5px solid var(--ink); background: var(--bg); border-radius: 4px; padding: 7px 16px; cursor: pointer; font-weight: 500; white-space: nowrap; }
.btn.primary { background: var(--ink); color: var(--bg); }
.btn:disabled { opacity: .35; cursor: default; }
.btn.sm { padding: 3px 10px; font-size: .8rem; border-color: var(--rule); }
/* マウスを重ねたときの色は、マウスで操作するときだけ（タッチでは、さわったあとに色が残らないように） */
@media (hover: hover) { .btn.sm:hover { border-color: var(--ink); } }
.link { border: 0; background: none; padding: 0; color: var(--sub); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; font-size: .8rem; }
@media (hover: hover) { .link:hover { color: var(--ink); } }

.main { max-width: 1320px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 48px;
  padding-block: 8px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
@media (max-width: 980px) { .main { grid-template-columns: minmax(0, 1fr); gap: 24px; } }
.col { min-width: 0; }
.sec { padding-block: 24px; border-bottom: 1px solid var(--rule); min-width: 0; }
.sec:last-child { border-bottom: 0; }
.sec h2 { font-size: 1.05rem; font-weight: 900; margin: 0 0 4px; display: flex; gap: 10px; align-items: baseline; }
.sec h2 .no { color: var(--faint); font-weight: 700; font-variant-numeric: tabular-nums; }
.lead { color: var(--sub); font-size: .82rem; margin: 0 0 16px; }

/* 日付 */
.datewrap { display: grid; grid-template-columns: minmax(0, 280px) minmax(0, 1fr); gap: 28px; }
@media (max-width: 600px) { .datewrap { grid-template-columns: minmax(0, 1fr); } }
.cal-head { display: flex; align-items: center; justify-content: space-between; font-weight: 500; margin-bottom: 4px; }
.cal-head button { border: 0; background: none; width: 30px; height: 30px; cursor: pointer; color: var(--sub); font-size: 1.1rem; border-radius: 50%; }
@media (hover: hover) { .cal-head button:hover { background: var(--soft); color: var(--ink); } }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px; text-align: center; font-variant-numeric: tabular-nums; }
.cal .dow { font-size: .7rem; color: var(--faint); }
.cal button { aspect-ratio: 1; max-width: 100%; border: 0; background: none; border-radius: 50%; cursor: pointer; font-size: .86rem; }
@media (hover: hover) { .cal button:hover { background: var(--soft); } }
.cal .hol { color: var(--faint); }
.cal button.today { text-decoration: underline; text-underline-offset: 3px; }
.cal button.on { background: var(--ink); color: var(--bg); }
.quick { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.dsum { font-weight: 900; margin-bottom: 6px; }
.dlist { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: .84rem; font-variant-numeric: tabular-nums; color: var(--sub); }
.dlist .own { color: var(--ink); font-weight: 700; }

/* 出題範囲 */
.target { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 12px; }
.target button { border: 1px solid var(--rule); background: var(--bg); border-radius: 999px; padding: 2px 12px; cursor: pointer; font-size: .8rem; font-variant-numeric: tabular-nums; }
.target button.own { border-color: var(--ink); }
.target button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.daybar { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 12px; font-size: .84rem; background: var(--soft); padding: 8px 12px; border-radius: 4px; margin-bottom: 14px; }
.daybar .grow { flex: 1 1 14em; min-width: 0; }
.daybar input[type="number"] { width: 4.5em; }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
.tab { border: 1.5px solid var(--rule); background: var(--bg); border-radius: 4px; padding: 5px 12px; cursor: pointer; color: var(--ink); font-size: .88rem; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; }
@media (hover: hover) { .tab:hover { border-color: var(--ink); } }
.tab[aria-selected="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.tab .cnt { font-size: .7rem; min-width: 1.5em; padding: 0 4px; border-radius: 999px; background: var(--red); color: #fff; text-align: center; font-variant-numeric: tabular-nums; }
.cats { display: block; }
.cats fieldset.seq { columns: 3 230px; column-gap: 28px; }
.cats fieldset.seq legend { column-span: all; }
.seq .unit { break-inside: avoid; }
.unit .no { min-width: 1.6em; text-align: right; color: var(--faint); font-variant-numeric: tabular-nums; font-size: .8rem; margin-top: 2px; }
fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
legend { display: flex; justify-content: space-between; align-items: baseline; width: 100%; padding: 0; margin-bottom: 4px; font-size: .76rem; font-weight: 700; color: var(--faint); letter-spacing: .1em; }
legend .link { font-size: .72rem; letter-spacing: 0; }
.unit { display: flex; gap: 8px; align-items: flex-start; padding: 2px 0; cursor: pointer; font-size: .92rem; line-height: 1.5; }
/* 単元のチェックボックス：少し大きめの角丸の四角。選ぶと黒くぬられて白い ✓（ブラウザ標準の形は使わず、どの端末でも同じ形に） */
.unit { -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }  /* 続けてタッチしても、単元名の文字が選択されないように */
.unit input { appearance: none; -webkit-appearance: none; flex: none; width: 20px; height: 20px; margin: 2px 0 0; border: 2px solid var(--faint); border-radius: 5px; background: var(--bg); display: grid; place-items: center; cursor: pointer; }
.unit input:checked { background: var(--ink); border-color: var(--ink); }
.unit input:checked::after { content: ""; width: 5px; height: 9px; border: solid var(--bg); border-width: 0 2px 2px 0; transform: translateY(-1px) rotate(45deg); }
@media (hover: hover) { .unit:hover input:not(:checked) { border-color: var(--ink); } }
/* 選んだ単元の数：上に細い線、数を大きな太字で。「すべて外す」は右はしの枠つきボタン */
.chosen { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: space-between; margin-top: 18px; padding-top: 12px; border-top: 1px solid var(--rule); font-size: .82rem; }
.chosen .lbl { display: flex; align-items: baseline; gap: 6px; color: var(--sub); }
.chosen .lbl b { font-size: 1.7rem; line-height: 1; font-weight: 900; color: var(--ink); }
.chosen .lbl.zero b { color: var(--faint); }
#seed.bad { border-color: var(--red); }
#seed { font-variant-numeric: tabular-nums; letter-spacing: .02em; }
.chosen .clear { border: 1.5px solid var(--ink); background: var(--bg); color: var(--ink); border-radius: 8px; padding: 5px 14px; font-size: .8rem; font-weight: 700; cursor: pointer; }
@media (hover: hover) { .chosen .clear:hover { background: var(--soft); } }
.chip { border: 1px solid var(--rule); background: var(--bg); border-radius: 4px; padding: 1px 8px; cursor: pointer; font-size: .78rem; }
@media (hover: hover) { .chip:hover { border-color: var(--red); color: var(--red); } }

/* 設定 */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 190px), 1fr)); gap: 16px 20px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field.wide { grid-column: 1 / -1; }
.field label { font-size: .78rem; font-weight: 700; color: var(--sub); }
input[type="text"], input[type="number"], select { width: 100%; border: 1.5px solid var(--line); border-radius: 8px; padding: 9px 12px; background: var(--bg); font-weight: 700; transition: border-color .15s, box-shadow .15s; }
@media (hover: hover) { input[type="text"]:hover, input[type="number"]:hover, select:hover { border-color: var(--sub); } }
input[type="text"]:focus, input[type="number"]:focus, select:focus { outline: none; border-color: var(--ink); box-shadow: 0 0 0 3px var(--ring); }
input::placeholder { color: var(--faint); font-weight: 500; }
select { appearance: none; -webkit-appearance: none; padding-right: 34px; cursor: pointer;
  background-image: linear-gradient(45deg, transparent 50%, var(--ink) 50%), linear-gradient(135deg, var(--ink) 50%, transparent 50%);
  background-position: calc(100% - 17px) 52%, calc(100% - 12px) 52%; background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; }
.checks { display: flex; flex-direction: column; gap: 6px; margin-top: 18px; }
.check { display: flex; gap: 8px; align-items: flex-start; cursor: pointer; font-size: .88rem; }
.check input { margin-top: 4px; accent-color: var(--ink); }
.check small { display: block; color: var(--sub); font-size: .76rem; }

/* プレビュー */
.preview { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 66px); align-self: start; min-width: 0; padding-top: 24px; }
@media (max-width: 980px) { .preview { position: static; padding-top: 0; } }
.pv-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
.pv-head h2 { font-size: 1.05rem; font-weight: 900; margin: 0; }
.pv-head span { font-size: .78rem; color: var(--sub); font-variant-numeric: tabular-nums; }
.pages { max-height: calc(100vh - 150px); overflow-y: auto; display: flex; flex-direction: column; gap: 12px; background: var(--soft); padding: 12px; border-radius: 4px; }
@media (max-width: 980px) { .pages { max-height: 80vh; } }
.pages canvas { width: 100%; height: auto; display: block; background: #fff; box-shadow: 0 0 0 1px var(--rule); }
.empty { color: var(--sub); text-align: center; padding: 80px 16px; font-size: .86rem; }
.note { font-size: .76rem; color: var(--sub); margin: 8px 0 0; }
.note b { color: var(--red); font-weight: 500; }
/* シンプル版の調整 */
.sec { padding-block: 20px; }
.sec h2 { margin-bottom: 12px; align-items: center; }
.sec h2 .dsum { font-size: .85rem; font-weight: 500; color: var(--sub); margin: 0; }
.sec h2 select { width: auto; font-size: .95rem; font-weight: 700; border-bottom: 1px solid var(--ink); padding: 2px 0; }
.cal-head, .cal, .quick { max-width: 320px; }
.quick { gap: 16px; }
.quick .link { font-size: .85rem; }
.chosen { margin-top: 14px; gap: 14px; }
.grid .check { align-self: end; padding-bottom: 6px; }
details.more { margin-top: 18px; }
details.more > summary { cursor: pointer; color: var(--sub); font-size: .85rem; margin-bottom: 14px; }
.preview .pages { margin-top: 0; }
/* カレンダー：枠で囲み、数字を太く大きく */
.cal-wrap { max-width: 360px; border: 1.5px solid var(--ink); border-radius: 10px; padding: 10px 12px 12px; }
.cal-head { max-width: none; font-weight: 900; font-size: 1.05rem; margin-bottom: 6px; }
.cal-head button { width: 34px; height: 34px; border: 1.5px solid var(--rule); border-radius: 8px; color: var(--ink); font-weight: 900; }
@media (hover: hover) { .cal-head button:hover { border-color: var(--ink); background: var(--bg); } }
.cal { max-width: none; gap: 4px; }
.cal .dow { font-size: .78rem; font-weight: 900; color: var(--ink); padding: 4px 0 6px; border-bottom: 1.5px solid var(--rule); margin-bottom: 4px; }
.cal .sun { color: var(--red); }
.cal .sat { color: var(--sat); }
.cal button { font-size: 1rem; font-weight: 700; color: var(--ink); border-radius: 8px; border: 1.5px solid transparent; }
.cal button.sun { color: var(--red); }
.cal button.sat { color: var(--sat); }
@media (hover: hover) { .cal button:hover { border-color: var(--ink); background: var(--bg); } }
.cal button.today { text-decoration: none; border-color: var(--ink); }
.cal button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* 設定：枠つきのパネル */
.setbox { border: 1.5px solid var(--rule); border-radius: 12px; padding: 18px; background: var(--bg); }
.field label { font-size: .8rem; font-weight: 900; color: var(--ink); }
.checks { margin-top: 16px; gap: 8px; }
.check { border: 1.5px solid var(--rule); border-radius: 8px; padding: 10px 12px; font-weight: 700; }
@media (hover: hover) { .check:hover { border-color: var(--sub); } }
.check:has(input:checked) { border-color: var(--ink); }
/* 行全体をうすくするのは、チェックボックスそのものが使えないときだけ（用語の問題の「問題数」の欄が使えないだけのときは、その欄だけうすく） */
.check:has(input[type="checkbox"]:disabled) { opacity: .5; cursor: default; }
.daybar input[type="number"] { padding: 4px 8px; }

/* 4つのボタンは同じ縦幅にそろえる */
.checks .check { box-sizing: border-box; height: 52px; padding: 0 12px; align-items: center; }
.checks .check > input, .termlbl input { margin-top: 0; }
/* 用語の問題数 */
.termrow { flex-wrap: nowrap; align-items: center; gap: 12px; cursor: default; }
.termlbl { display: flex; gap: 8px; align-items: center; cursor: pointer; flex: 1 1 auto; min-width: 0; height: 100%; }
.termlbl input { accent-color: var(--ink); }
.termn { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; white-space: nowrap; }
.termn input[type="number"] { width: 4.6em; padding: 4px 8px; text-align: right; }
.termn:has(input:disabled) { opacity: .45; }
/* 設定の4つのボタン：チェックボックスは見せず（読み上げ・キーボード用に残す）、オンのときはボタンを黒くぬる（学年のタブと同じ） */
.checks .check { position: relative; }
.checks .check > input[type="checkbox"], .termlbl input[type="checkbox"] { position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0; pointer-events: none; }
.checks .check:has(input[type="checkbox"]:checked) { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.checks .check:has(input[type="checkbox"]:focus-visible) { outline: 2px solid var(--ink); outline-offset: 2px; }
.checks .check:has(input[type="checkbox"]:checked) .termn input[type="number"] { background: var(--bg); color: var(--ink); border-color: var(--bg); }
/* プレビュー：作り直し中はうすく */
.pages canvas { transition: opacity .15s; }
.pages.stale canvas { opacity: .4; }
/* iPad 用の数字パッド（iPad には数字だけのキーボードがないため） */
.numpad { position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; background: var(--bg); border-top: 1.5px solid var(--ink); padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); touch-action: manipulation; user-select: none; -webkit-user-select: none; }
.numpad .np-keys { display: grid; grid-template-columns: repeat(3, 1fr) 1.4fr; gap: 8px; max-width: 560px; margin: 0 auto; }
.numpad[hidden] { display: none; }
.numpad button { -webkit-tap-highlight-color: transparent; color: var(--ink); height: 52px; border: 1.5px solid var(--rule); border-radius: 6px; background: var(--bg); font-size: 1.35rem; font-weight: 700; cursor: pointer; }
.numpad button:active { background: var(--soft); border-color: var(--ink); }
.numpad .np-done { grid-column: 4; grid-row: 3 / span 2; background: var(--ink); color: var(--bg) !important; border-color: var(--ink); font-size: 1.05rem; }
.numpad .np-del { grid-column: 4; grid-row: 1 / span 2; font-size: 1.1rem; }
.numpad .np-zero { grid-column: 1 / span 3; }
</style>

</head>
<body>
<div class="bar">
  <div class="bar-in">
    <h1>プリント作成</h1>
    <span class="status" id="status" role="status">準備しています…</span>
    <button class="btn primary" id="make" type="button" disabled>作る</button>
    <button class="btn" id="save" type="button" disabled hidden>ダウンロード</button>
  </div>
</div>

<div class="main">
  <div class="col">
    <section class="sec" aria-labelledby="h-date">
      <h2 id="h-date">日付 <span class="dsum" id="dsum"></span></h2>
      <div class="cal-wrap">
      <div class="cal-head"><button type="button" id="prev" aria-label="前の月">‹</button><span id="month"></span><button type="button" id="next" aria-label="次の月">›</button></div>
      <div class="cal" id="cal"></div>
      </div>
    </section>

    <section class="sec" aria-labelledby="h-unit">
      <h2 id="h-unit">単元</h2>
      <div class="tabs" role="tablist" id="tabs" aria-label="学年"></div>
      <div class="target" id="target"></div>
      <div class="daybar" id="daybar" hidden></div>
      <div class="cats" id="cats"></div>
      <div class="chosen" id="chosen"></div>
    </section>

    <section class="sec" aria-labelledby="h-set">
      <h2 id="h-set">設定</h2>
      <div class="setbox">
      <div class="grid">
        <div class="field wide"><label for="title">課題名</label><input id="title" type="text" maxlength="40" value="計算プリント"></div>
        <div class="field"><label for="count">1日の問題数</label><input id="count" type="number" inputmode="numeric" pattern="[0-9]*" min="1" max="100" value="12"></div>
        <div class="field"><label for="output">出力</label>
          <select id="output"><option value="both" selected>問題と解答</option><option value="problems">問題のみ</option><option value="answers">解答のみ</option></select></div>
        <div class="field"><label for="order">解答の位置</label>
          <select id="order"><option value="day" selected>日ごとに問題のあと</option><option value="last">最後にまとめる</option></select></div>
        <div class="field"><label for="seed">プリント番号（任意）</label><input id="seed" type="text" inputmode="text" autocapitalize="characters" autocomplete="off" spellcheck="false" maxlength="40" placeholder="プリント左下の番号で呼び出し"></div>
      </div>
      <div class="checks">

// ---------- 日付 ----------
let view = new Date(today.getFullYear(), today.getMonth(), 1);
function renderCal() {
  $("month").textContent = `${view.getFullYear()}年${view.getMonth() + 1}月`;
  const grid = $("cal");
  grid.replaceChildren(...DOW.split("").map((d, i) => el("div", { className: "dow" + (i === 0 ? " sun" : i === 6 ? " sat" : ""), textContent: d })));

  for (let d = 1; d <= n; d++) {
    const date = new Date(view.getFullYear(), view.getMonth(), d);
    const k = iso(date);
    const b = el("button", { type: "button", textContent: d });

function renderDates() {

// ---------- 出題範囲 ----------
function renderTarget() {

function renderTabs() {

  const bits = [];
  const put = (v, n) => { for (let i = n - 1; i >= 0; i--) bits.push((v >> i) & 1); };
  const putVar = (v) => { do { const c = v & 7; v >>= 3; bits.push(v ? 1 : 0); put(c, 3); } while (v); };
  const putUnits = (us) => { const ids = us.map((k) => CODE_UNITS.indexOf(k)).filter((i) => i >= 0); put(ids.length, 7); ids.forEach((i) => put(i, 8)); };
  put(1, 3);  // 版
  put(cfg.seed, 16); put(cfg.count, 7);
  put(cfg.sections ? 1 : 0, 1); put(cfg.ordered ? 1 : 0, 1); put(cfg.guide ? 1 : 0, 1);
  put(cfg.terms ? 1 : 0, 1); if (cfg.terms) put(cfg.terms, 7);
  put(cfg.dates.length, 5);
  cfg.dates.forEach((k, i) => (i ? putVar(dayNo(k) - dayNo(cfg.dates[i - 1]) - 1) : put(dayNo(k), 13)));
  putUnits(cfg.common);
  if (cfg.dates.length > 1) cfg.per_day.forEach((d) => { put(d ? 1 : 0, 1); if (d) { putUnits(d.units); put(d.count || 0, 7); } });
  put(codeCheck(bits), 8);
  while (bits.length % 5) bits.push(0);
  let out = "";
  for (let i = 0; i < bits.length; i += 5) out += B32[parseInt(bits.slice(i, i + 5).join(""), 2)];
  return out.match(/.{1,4}/g).join("-");
}

function decodeCode(text) {
  const t = String(text).toUpperCase().replace(/[\s\-ー－]/g, "").replace(/O/g, "0").replace(/[IL]/g, "1");
  if (t.length < 12 || /[^0-9A-Z]/.test(t)) return null;
  const bits = [];
  for (const ch of t) { const v = B32.indexOf(ch); if (v < 0) return null; for (let i = 4; i >= 0; i--) bits.push((v >> i) & 1); }
  let p = 0;
  const get = (n) => { let v = 0; for (let i = 0; i < n; i++) { if (p >= bits.length) throw 0; v = v * 2 + bits[p++]; } return v; };
  const getVar = () => { let v = 0, sh = 0, more; do { more = get(1); v |= get(3) << sh; sh += 3; } while (more && sh < 24); return v; };
  const getUnits = () => { const n = get(7), us = []; for (let i = 0; i < n; i++) { const k = CODE_UNITS[get(8)]; if (!k) throw 0; us.push(k); } return us; };
  try {
    if (get(3) !== 1) return null;
    const cfg = { seed: get(16), count: get(7), sections: !!get(1), ordered: !!get(1), guide: !!get(1) };
    cfg.terms = get(1) ? get(7) : 0;
    const n = get(5);
    cfg.dates = [];
    for (let i = 0; i < n; i++) cfg.dates.push(i ? dayKey(dayNo(cfg.dates[i - 1]) + 1 + getVar()) : dayKey(get(13)));
    cfg.common = getUnits();
    cfg.per_day = cfg.dates.map(() => null);
    if (n > 1) cfg.per_day = cfg.dates.map(() => (get(1) ? { units: getUnits(), count: get(7) || null } : null));
    const body = bits.slice(0, p);
    if (get(8) !== codeCheck(body)) return null;
    if (bits.slice(p).some((b) => b) || bits.length - p >= 5) return null;  // 余分な文字がある
    if (!(cfg.seed >= 1 && cfg.count >= 1 && cfg.count <= 100)) return null;
    return cfg;
  } catch { return null; }
}

// 「プリント番号」の欄にコードが入ったら、その設定を画面にもどす（出力・解答の位置・課題名はそのまま）
let appliedCode = "";
function applyCode(cfg) {
  dates.clear(); cfg.dates.forEach((k) => dates.add(k));
  perDay = {};
  cfg.dates.forEach((k, i) => { if (cfg.per_day[i]) perDay[k] = { units: [...cfg.per_day[i].units], count: cfg.per_day[i].count }; });
  common = new Set(cfg.common); save();
  target = "common";
  $("count").value = cfg.count;
  $("terms").checked = cfg.terms > 0; if (cfg.terms) $("termsN").value = cfg.terms;
  $("sections").checked = cfg.sections; $("ordered").checked = cfg.ordered; $("guide").checked = cfg.guide;
  if (cfg.dates.length) { const d = new Date(cfg.dates[0] + "T00:00"); view = new Date(d.getFullYear(), d.getMonth(), 1); }
  const first = cfg.common[0] || (cfg.per_day.find((d) => d) || { units: [] }).units[0];
  const g = first && UNITS.find((x) => x.cats.some((c) => c.units.some(([k]) => k === first)));
  if (g) { grade = g.grade; store.set("grade", grade); }
  const s = {}; FIELDS.forEach((k) => (s[k] = $(k).value)); CHECKS.forEach((k) => (s[k] = $(k).checked)); store.set("settings", s);
  syncShuffle();
  renderDates();
}
function seedInput() {
  const v = $("seed").value.trim();
  const cfg = decodeCode(v);
  $("seed").classList.toggle("bad", !!v && !cfg && !/^\d{1,6}$/.test(v));
  if (!cfg) appliedCode = "";  // 消したあとに同じ番号を入れ直したときも、もう一度呼び出す
  if (cfg && v !== appliedCode) {
    appliedCode = v;
    applyCode(cfg);
    setStatus("プリントを呼び出しました。出力（解答をつけるか）は自由に変えられます。");
  }
  schedule();
}
$("seed").addEventListener("input", seedInput);

// ---------- PDF ----------
pdfjsLib.GlobalWorkerOptions.workerSrc = new URL("pdf.worker.min.js", location.href).href;
let py = null, lastPdf = null, lastName = "", downloads = null, gothicLoaded = false;
const inClaude = !!(window.claude && window.claude.use);
const FONTS = ["KleeOne-SemiBold.ttf", "KaTeX_Main-Regular.ttf", "KaTeX_Math-Italic.ttf", "KaTeX_Size4-Regular.ttf"];
const setStatus = (text, err = false) => { const s = $("status"); s.textContent = text; s.classList.toggle("err", err); };

const BUNDLE = "bundle-2d739de3eb.b64.txt";
const PAGE_V = "5c2e1f4c43";  // ページの版（中身が変わるたびに変わる）
// ブラウザに古いページが残っていたら、最新のページに切りかえる（GitHub Pages は数分ページを覚えておくため）
async function newerPage() {
  try {
    const res = await fetch(location.pathname + "?check=" + Date.now(), { cache: "no-store" });
    if (!res.ok) return false;
    const m = (await res.text()).match(/const PAGE_V = "([0-9a-f]{10})"/);
    if (m && m[1] !== PAGE_V && !location.search.includes(m[1])) {
      location.replace(location.pathname + "?v=" + m[1]);
      return true;
    }
  } catch {}
  return false;
}

async function boot() {
  if (await newerPage()) return;
  try {
    const b64 = async (url) => {
      const res = await fetch(url, { cache: "no-cache" });
      if (!res.ok) throw new Error(url + " " + res.status);
      const bin = atob((await res.text()).trim());
      const out = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
      return out;
    };
    const bin = async (url) => { const res = await fetch(url, { cache: "no-cache" }); if (!res.ok) throw new Error(url + " " + res.status); return new Uint8Array(await res.arrayBuffer()); };
    const [stdlib, buf, ...fonts] = await Promise.all([b64("pyodide/python_stdlib.b64.txt"), b64("py/" + BUNDLE), ...FONTS.map((f) => bin("fonts/" + f))]);
    const stdLibURL = URL.createObjectURL(new Blob([stdlib], { type: "application/zip" }));
    py = await loadPyodide({ indexURL: new URL("pyodide/", location.href).href, stdLibURL });
    py.unpackArchive(buf, "zip", { extractDir: "/app" });
    py.FS.mkdirTree("/app/worksheets/fonts");
    FONTS.forEach((f, i) => py.FS.writeFile("/app/worksheets/fonts/" + f, fonts[i]));
    py.runPython(`
import sys, json, datetime as dt
sys.path.insert(0, "/app")
from worksheets.sheets import make_days
from worksheets.pdf import build_pdf

def make(cfg):
    c = json.loads(cfg)
    ds = [dt.date.fromisoformat(d) for d in c["dates"]]
    days = make_days(c["units"], int(c["count"]), int(c["seed"]), ds, shuffle=c["shuffle"], per_day=c["per_day"], terms=c["terms"], ordered=c.get("ordered", False))
    if c.get("code"):  # 左下の No. には、呼び出しコード（何日分かあるときは何日目か）を書く
        for i, d in enumerate(days):
            d["serial"] = c["code"] + (f"（{i + 1}日目）" if len(days) > 1 else "")
    return build_pdf(days, title=c["title"], spacing=c["spacing"], output=c["output"],
                     answers_last=c["answers_last"], sections=c["sections"], guide=c.get("guide", False))
`);
    $("make").disabled = false;
    try { sessionStorage.removeItem("mp-reload"); } catch {}
    setStatus("");
    run(true);
  } catch (e) {
    console.error(e);
    // 古いページがブラウザに残っていて、新しいファイルが見つからないときは、1回だけ最新のページを読み直す
    let retried = false;
    try { retried = sessionStorage.getItem("mp-reload") === "1"; } catch {}
    if (/ 404$/.test(String(e.message || "")) && !retried) {
      try { sessionStorage.setItem("mp-reload", "1"); } catch {}
      location.replace(location.pathname + "?v=" + Date.now());
      return;
    }
    setStatus("起動できませんでした。ページを再読み込みしてください。（" + String(e.message || e).trim().split("\n").pop().slice(0, 120) + "）", true);
  }
}

// 変更のたびにプレビューを作り直す（連続した変更はまとめ、作成中の変更は終わってからすぐ反映）
let busy = false, again = false, againFresh = false, curSeed = null, timer = null;
function schedule() {
  if (!py) return;
  $("pages").classList.add("stale");
  setStatus("更新中…");
  clearTimeout(timer);
  timer = setTimeout(() => run(false), 250);
}
async function run(fresh) {
  if (!py) return;
  clearTimeout(timer);
  if (busy) { again = true; againFresh = againFresh || fresh; return; }
  busy = true;
  try { await make(fresh); }
  finally {
    busy = false;
    if (again) { const f = againFresh; again = false; againFresh = false; run(f); }
  }
}

async function make(fresh = true) {
  const done = () => $("pages").classList.remove("stale");
  const list = [...dates].sort();
  const per_day = list.map((k) => (list.length > 1 && perDay[k] ? { units: [...perDay[k].units], count: perDay[k].count } : null));
  const empty = list.find((k, i) => per_day[i] && !per_day[i].units.length);
  if (empty) { done(); setStatus(`${short(empty)} の単元を選んでください。`, true); return; }
  const needCommon = !list.length || per_day.some((d) => !d);
  if (needCommon && !common.size) { done(); setStatus("単元を1つ以上選んでください。", true); return; }
  const count = parseInt($("count").value, 10);
  if (!(count >= 1 && count <= 100)) { done(); setStatus("問題数は 1〜100 で入力してください。", true); return; }
  const termsN = parseInt($("termsN").value, 10);
  if ($("terms").checked && !(termsN >= 1 && termsN <= 100)) { done(); setStatus("用語の問題数は 1〜100 で入力してください。", true); return; }
  const title = $("title").value.trim() || "計算プリント";
  // 「プリント番号」の欄：呼び出しコードならその種、6けたまでの数（前の番号）ならその数、空欄なら毎回ちがう種
  const seedText = $("seed").value.trim();
  const fromCode = decodeCode(seedText);
  const seedIn = fromCode ? fromCode.seed : /^\d{1,6}$/.test(seedText) ? parseInt(seedText, 10) : NaN;
  const seed = seedIn >= 1 && seedIn <= 999999 ? seedIn : (fresh || curSeed === null ? 1 + Math.floor(Math.random() * 65535) : curSeed);
  curSeed = seed;
  const output = $("output").value;
  const sections = $("sections").checked;
  const cfg = { units: common.size ? [...common] : per_day.find((d) => d).units, count, seed, dates: list, per_day,
    shuffle: false, ordered: $("ordered").checked, sections, terms: $("terms").checked ? termsN : 0, guide: $("guide").checked, title, spacing: "normal", output, answers_last: $("order").value === "last" };
  // 呼び出しコード（種が 65535 より大きい前の番号のときは作れないので、前と同じ6けたの番号を書く）
  cfg.code = seed <= 65535 ? encodeCode({ ...cfg, common: [...common] }) : "";
  setStatus(list.length > 1 ? `${list.length} 日分を作成中…` : "作成中…");
  await new Promise((r) => setTimeout(r, 30));
  if (cfg.guide && !gothicLoaded) {  // 説明の重要語句に使うゴシック体は、説明を入れるときだけ読み込む
    try {
      const res = await fetch("fonts/ipag.ttf");
      if (res.ok) { py.FS.writeFile("/app/worksheets/fonts/ipag.ttf", new Uint8Array(await res.arrayBuffer())); gothicLoaded = true; }
    } catch (e) { console.warn(e); }
  }
  try {
    const fn = py.globals.get("make");
    const res = fn(JSON.stringify(cfg));
    lastPdf = res.toJs(); res.destroy(); fn.destroy();
    const suffix = { both: "", problems: "_問題", answers: "_解答" }[output];
    const span = list.length ? "_" + list[0].replaceAll("-", "") + (list.length > 1 ? "-" + list[list.length - 1].replaceAll("-", "") : "") : "";
    lastName = `${title}${suffix}${span}.pdf`.replace(/[\\/:*?"<>|]/g, "_");
    await render(lastPdf, fresh);
    if (again) return;  // さらに新しい変更がある
    setStatus("できました");
    $("pinfo").textContent += cfg.code ? `　No.${cfg.code}（この番号で同じプリントを呼び出せます）` : `　No.${String(seed).padStart(6, "0")}（同じ番号で同じ問題を作れます）`;
    if (!inClaude || downloads) { $("save").hidden = false; $("save").disabled = false; }
  } catch (e) {
    console.error(e);
    setStatus("作成できませんでした: " + String(e.message || e).split("\n").slice(-2).join(" "), true);
  } finally {
    done();
  }
}

async function render(bytes, toTop = true) {
  const doc = await pdfjsLib.getDocument({ data: bytes.slice() }).promise;
  const box = $("pages");
  const keep = box.scrollTop;
  const canvases = [];
  const width = Math.max(300, box.clientWidth - 24);
  const max = Math.min(doc.numPages, 40);
  for (let i = 1; i <= max; i++) {
    const page = await doc.getPage(i);
    const base = page.getViewport({ scale: 1 });
    const vp = page.getViewport({ scale: (width / base.width) * Math.min(window.devicePixelRatio || 1, 2) });
    const cv = el("canvas", { width: vp.width, height: vp.height });
    cv.setAttribute("aria-label", `${i}ページ目`);
    await page.render({ canvasContext: cv.getContext("2d"), viewport: vp }).promise;
    canvases.push(cv);
    // 最初の2ページができたらすぐ差しかえ、残りは後から足す
    if (i === Math.min(2, max)) { box.replaceChildren(...canvases); box.scrollTop = toTop ? 0 : keep; }
    else if (i > 2) box.append(cv);
    if (again) break;
  }
  if (!toTop) box.scrollTop = keep;
  $("pinfo").textContent = doc.numPages > max ? `${doc.numPages} ページ（最初の${max}ページを表示）` : `${doc.numPages} ページ`;
}

$("make").addEventListener("click", () => run(true));
$("save").addEventListener("click", async () => {
  if (!lastPdf) return;
  const blob = new Blob([lastPdf], { type: "application/pdf" });
  if (inClaude) {
    if (!downloads) return;
    try { await downloads.save({ filename: lastName, data: blob }); setStatus("ダウンロードしました"); }
    catch (e) {
      if (e && e.code === "declined") setStatus("ダウンロードをキャンセルしました");
      else if (e && e.code === "rate_limited") setStatus("少し待ってからもう一度押してください", true);
      else { setStatus("この画面ではダウンロードできません", true); $("save").hidden = true; }
    }
    return;
  }
  const url = URL.createObjectURL(blob);
  const a = el("a", { href: url, download: lastName });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
});

if (inClaude) {
  (async () => {
    try { downloads = await window.claude.use("downloads"); } catch { downloads = null; }
    if (downloads && lastPdf) { $("save").hidden = false; $("save").disabled = false; }
  })();
}

// iPad には数字だけのキーボードがないので、数字の欄ではページの中の数字パッドを出す
(function numpad() {
  const ua = navigator.userAgent;
  const isIPad = /iPad/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  if (!isIPad) return;
  const pad = $("numpad");
  let cur = null, fresh = false;
  const inputs = Array.from(document.querySelectorAll('input[inputmode="numeric"]'));
  inputs.forEach((el) => {
    el.setAttribute("inputmode", "none");  // ふつうのキーボードは出さない（外付けキーボードはそのまま使える）
    el.addEventListener("focus", () => { cur = el; fresh = true; pad.hidden = false; document.body.style.paddingBottom = pad.offsetHeight + 12 + "px"; setTimeout(() => {  // 入力欄が数字パッドに隠れないように、ページを上にずらす
      const r = el.getBoundingClientRect(), limit = window.innerHeight - pad.offsetHeight - 24;
      if (r.bottom > limit) window.scrollBy({ top: r.bottom - limit, behavior: "smooth" });
      else if (r.top < 8) window.scrollBy({ top: r.top - 24, behavior: "smooth" });
    }, 30); });
    el.addEventListener("blur", () => { setTimeout(() => { if (document.activeElement !== cur) { pad.hidden = true; document.body.style.paddingBottom = ""; cur = null; } }, 0); });
  });
  pad.addEventListener("pointerdown", (e) => e.preventDefault());  // パッドを押しても入力欄からフォーカスを外さない
  pad.addEventListener("mousedown", (e) => e.preventDefault());
  pad.addEventListener("click", (e) => {
    const k = e.target.closest("button")?.dataset.k;
    if (!k || !cur) return;
    if (k === "done") { cur.blur(); return; }
    const maxLen = String(cur.max || "999999").length;
    let v = cur.value;
    if (k === "del") v = fresh ? "" : v.slice(0, -1);
    else v = (fresh ? "" : v) + k;
    v = v.replace(/^0+(?=\d)/, "").slice(0, maxLen);
    fresh = false;
    cur.value = v;
    cur.dispatchEvent(new Event("input", { bubbles: true }));
    cur.dispatchEvent(new Event("change", { bubbles: true }));
  });
})();
// 画面を拡大・縮小しないように固定する（iPhone・iPad の Safari は、ページの設定だけでは 2本指の拡大を止められない）
(function lockZoom() {
  const stop = (e) => { if (e.cancelable) e.preventDefault(); };
  const opt = { passive: false, capture: true };
  ["gesturestart", "gesturechange", "gestureend"].forEach((t) => { window.addEventListener(t, stop, opt); document.addEventListener(t, stop, opt); });
  // 2本目の指が置かれた時点で止める（とちゅうからでは止まらないことがある）
  window.addEventListener("touchstart", (e) => { if (e.touches.length > 1) stop(e); }, opt);
  window.addEventListener("touchmove", (e) => { if (e.touches.length > 1 || (e.scale !== undefined && e.scale !== 1)) stop(e); }, opt);
  // すばやい2回タップでの拡大も止める（入力欄・ボタンの操作はそのまま）
  let last = 0;
  window.addEventListener("touchend", (e) => {
    const now = Date.now();
    if (now - last < 350 && !e.target.closest("input, textarea, select, button, label, a")) stop(e);
    last = now;
  }, opt);
})();
boot();
</script>
