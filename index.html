<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>プリント作成</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: 白い紙面に罫線だけで区切る。左に設定を上から順に、右にプリントのプレビュー。色は墨一色、赤は解答の意味でだけ。 */
:root {
  --bg: #ffffff; --ink: #111111; --sub: #6b6b6b; --faint: #a3a3a3; --rule: #e6e6e6; --soft: #f5f5f5; --red: #c8321f;
  --font: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #121212; --ink: #ededed; --sub: #a0a0a0; --faint: #6e6e6e; --rule: #2a2a2a; --soft: #1c1c1c; --red: #ff8a7a; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #121212; --ink: #ededed; --sub: #a0a0a0; --faint: #6e6e6e; --rule: #2a2a2a; --soft: #1c1c1c; --red: #ff8a7a; color-scheme: dark; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 14px; line-height: 1.7; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--rule); }
.bar-in { max-width: 1320px; margin: 0 auto; display: flex; align-items: center; gap: 10px 16px; flex-wrap: wrap;
  padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.bar h1 { font-size: 1.05rem; font-weight: 700; margin: 0 auto 0 0; letter-spacing: .06em; }
.status { font-size: .8rem; color: var(--sub); }
.status.err { color: var(--red); }

.btn { border: 1px solid var(--ink); background: var(--bg); border-radius: 4px; padding: 7px 16px; cursor: pointer; font-weight: 500; white-space: nowrap; }
.btn.primary { background: var(--ink); color: var(--bg); }
.btn:disabled { opacity: .35; cursor: default; }
.btn.sm { padding: 3px 10px; font-size: .8rem; border-color: var(--rule); }
.btn.sm:hover { border-color: var(--ink); }
.link { border: 0; background: none; padding: 0; color: var(--sub); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; font-size: .8rem; }
.link:hover { color: var(--ink); }

.main { max-width: 1320px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 48px;
  padding-block: 8px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
@media (max-width: 980px) { .main { grid-template-columns: minmax(0, 1fr); gap: 24px; } }
.col { min-width: 0; }
.sec { padding-block: 24px; border-bottom: 1px solid var(--rule); min-width: 0; }
.sec:last-child { border-bottom: 0; }
.sec h2 { font-size: .95rem; font-weight: 700; margin: 0 0 4px; display: flex; gap: 10px; align-items: baseline; }
.sec h2 .no { color: var(--faint); font-weight: 500; font-variant-numeric: tabular-nums; }
.lead { color: var(--sub); font-size: .82rem; margin: 0 0 16px; }

/* 日付 */
.datewrap { display: grid; grid-template-columns: minmax(0, 280px) minmax(0, 1fr); gap: 28px; }
@media (max-width: 600px) { .datewrap { grid-template-columns: minmax(0, 1fr); } }
.cal-head { display: flex; align-items: center; justify-content: space-between; font-weight: 500; margin-bottom: 4px; }
.cal-head button { border: 0; background: none; width: 30px; height: 30px; cursor: pointer; color: var(--sub); font-size: 1.1rem; border-radius: 50%; }
.cal-head button:hover { background: var(--soft); color: var(--ink); }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px; text-align: center; font-variant-numeric: tabular-nums; }
.cal .dow { font-size: .7rem; color: var(--faint); }
.cal button { aspect-ratio: 1; max-width: 100%; border: 0; background: none; border-radius: 50%; cursor: pointer; font-size: .86rem; }
.cal button:hover { background: var(--soft); }
.cal .hol { color: var(--faint); }
.cal button.today { text-decoration: underline; text-underline-offset: 3px; }
.cal button.on { background: var(--ink); color: var(--bg); }
.quick { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.dsum { font-weight: 700; margin-bottom: 6px; }
.dlist { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: .84rem; font-variant-numeric: tabular-nums; color: var(--sub); }
.dlist .own { color: var(--ink); font-weight: 700; }

/* 出題範囲 */
.target { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 12px; }
.target button { border: 1px solid var(--rule); background: var(--bg); border-radius: 999px; padding: 2px 12px; cursor: pointer; font-size: .8rem; font-variant-numeric: tabular-nums; }
.target button.own { border-color: var(--ink); }
.target button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.daybar { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 12px; font-size: .84rem; background: var(--soft); padding: 8px 12px; border-radius: 4px; margin-bottom: 14px; }
.daybar .grow { flex: 1 1 14em; min-width: 0; }
.daybar input[type="number"] { width: 4.5em; }
.tabs { display: flex; flex-wrap: wrap; gap: 2px 18px; margin-bottom: 14px; border-bottom: 1px solid var(--rule); }
.tab { border: 0; background: none; padding: 6px 0; margin-bottom: -1px; border-bottom: 2px solid transparent; cursor: pointer; color: var(--sub); font-size: .86rem; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); font-weight: 700; }
.tab .cnt { font-size: .72rem; margin-left: 3px; font-variant-numeric: tabular-nums; }
.cats { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 240px), 1fr)); gap: 16px 28px; }
fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
legend { display: flex; justify-content: space-between; align-items: baseline; width: 100%; padding: 0; margin-bottom: 4px; font-size: .74rem; color: var(--faint); letter-spacing: .1em; }
legend .link { font-size: .72rem; letter-spacing: 0; }
.unit { display: flex; gap: 8px; align-items: flex-start; padding: 2px 0; cursor: pointer; font-size: .88rem; line-height: 1.5; }
.unit input { margin-top: 3px; accent-color: var(--ink); }
.chosen { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 18px; font-size: .8rem; }
.chosen .lbl { color: var(--sub); margin-right: 4px; }
.chip { border: 1px solid var(--rule); background: var(--bg); border-radius: 4px; padding: 1px 8px; cursor: pointer; font-size: .78rem; }
.chip:hover { border-color: var(--red); color: var(--red); }

/* 設定 */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 190px), 1fr)); gap: 16px 20px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field.wide { grid-column: 1 / -1; }
.field label { font-size: .76rem; color: var(--sub); }
input[type="text"], input[type="number"], select { width: 100%; border: 0; border-bottom: 1px solid var(--rule); border-radius: 0; padding: 6px 0; background: transparent; }
input[type="text"]:focus, input[type="number"]:focus, select:focus { outline: none; border-bottom-color: var(--ink); }
.checks { display: flex; flex-direction: column; gap: 6px; margin-top: 18px; }
.check { display: flex; gap: 8px; align-items: flex-start; cursor: pointer; font-size: .88rem; }
.check input { margin-top: 4px; accent-color: var(--ink); }
.check small { display: block; color: var(--sub); font-size: .76rem; }

/* プレビュー */
.preview { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 66px); align-self: start; min-width: 0; padding-top: 24px; }
@media (max-width: 980px) { .preview { position: static; padding-top: 0; } }
.pv-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
.pv-head h2 { font-size: .95rem; margin: 0; }
.pv-head span { font-size: .78rem; color: var(--sub); font-variant-numeric: tabular-nums; }
.pages { max-height: calc(100vh - 150px); overflow-y: auto; display: flex; flex-direction: column; gap: 12px; background: var(--soft); padding: 12px; border-radius: 4px; }
@media (max-width: 980px) { .pages { max-height: 80vh; } }
.pages canvas { width: 100%; height: auto; display: block; background: #fff; box-shadow: 0 0 0 1px var(--rule); }
.empty { color: var(--sub); text-align: center; padding: 80px 16px; font-size: .86rem; }
.note { font-size: .76rem; color: var(--sub); margin: 8px 0 0; }
.note b { color: var(--red); font-weight: 500; }
</style>

</head>
<body>
<div class="bar">
  <div class="bar-in">
    <h1>プリント作成</h1>
    <span class="status" id="status" role="status">準備しています…（初回は 20MB ほど読み込みます）</span>
    <button class="btn primary" id="make" type="button" disabled>プリントを作る</button>
    <button class="btn" id="save" type="button" disabled hidden>PDF をダウンロード</button>
  </div>
</div>

<div class="main">
  <div class="col">
    <section class="sec" aria-labelledby="h-date">
      <h2 id="h-date"><span class="no">1</span>日付</h2>
      <p class="lead">選んだ日ごとに別の問題で1枚ずつ作り、1つのPDFにまとめます（最大31日）。</p>
      <div class="datewrap">
        <div>
          <div class="cal-head"><button type="button" id="prev" aria-label="前の月">‹</button><span id="month"></span><button type="button" id="next" aria-label="次の月">›</button></div>
          <div class="cal" id="cal"></div>
          <div class="quick">
            <button class="btn sm" type="button" data-q="today">今日</button>
            <button class="btn sm" type="button" data-q="week">今週の月〜金</button>
            <button class="btn sm" type="button" data-q="nextweek">来週の月〜金</button>
            <button class="link" type="button" data-q="clear">すべて外す</button>
          </div>
        </div>
        <div>
          <div class="dsum" id="dsum"></div>
          <div class="dlist" id="dlist"></div>
        </div>
      </div>
    </section>

    <section class="sec" aria-labelledby="h-unit">
      <h2 id="h-unit"><span class="no">2</span>出題範囲</h2>
      <p class="lead">単元を選びます。複数日のときは、日付を押すとその日だけ選び直せます。</p>
      <div class="target" id="target"></div>
      <div class="daybar" id="daybar" hidden></div>
      <div class="tabs" role="tablist" id="tabs"></div>
      <div class="cats" id="cats"></div>
      <div class="chosen" id="chosen"></div>
    </section>

    <section class="sec" aria-labelledby="h-set">
      <h2 id="h-set"><span class="no">3</span>設定</h2>
      <div class="grid">
        <div class="field wide"><label for="title">課題名</label><input id="title" type="text" maxlength="40" value="計算プリント"></div>
        <div class="field"><label for="count">1日の問題数</label><input id="count" type="number" min="1" max="100" value="12"></div>
        <div class="field"><label for="spacing">計算スペース</label>
          <select id="spacing"><option value="narrow">せまい</option><option value="normal" selected>ふつう</option><option value="wide">ひろい</option></select></div>
        <div class="field"><label for="output">出力</label>
          <select id="output"><option value="both" selected>問題と解答</option><option value="problems">問題のみ</option><option value="answers">解答のみ</option></select></div>
        <div class="field"><label for="order">解答の位置</label>
          <select id="order"><option value="day" selected>日ごとに問題のあと</option><option value="last">最後にまとめる</option></select></div>
        <div class="field"><label for="seed">プリント番号（任意）</label><input id="seed" type="number" min="1" max="999999" placeholder="空欄なら毎回ちがう問題"></div>
      </div>
      <div class="checks">
        <label class="check"><input id="sections" type="checkbox" checked><span>大問構成にする<small>単元ごとに「1 次の計算をしなさい。」のようにまとめ、(1)(2)… の番号を大問ごとにふり直します。</small></span></label>
        <label class="check"><input id="shuffle" type="checkbox"><span>単元をまぜて出題する<small>大問構成にしないときに使えます。</small></span></label>
      </div>
    </section>
  </div>

  <aside class="preview" aria-label="プレビュー">
    <div class="pv-head"><h2>プレビュー</h2><span id="pinfo"></span></div>
    <div class="pages" id="pages"><div class="empty">準備ができると、ここに見本のプリントが表示されます。</div></div>
    <p class="note"><b>赤字</b>は解答用紙です。左下の No. を「プリント番号」に入れると、同じ問題を作り直せます。</p>
  </aside>
</div>

<script src="pdf.min.js"></script>

2_linear_graph", "一次関数のグラフ"]]}, {"cat": "データの活用", "units": [["d2_prob", "確率"], ["d2_quartile", "四分位数・四分位範囲"]]}]}, {"grade": "中学3年", "cats": [{"cat": "数と式", "units": [["j3_expand", "式の展開"], ["j3_factor", "因数分解"], ["j3_sqrt", "平方根の計算"], ["j3_quad", "二次方程式（因数分解で解く）"], ["d3_prime", "素因数分解"], ["d3_rationalize", "分母の有理化"], ["d3_quad_more", "二次方程式（平方根・解の公式）"]]}, {"cat": "文章題", "units": [["w9_word", "二次方程式の文章題"]]}, {"cat": "図形", "units": [["h3_pythagoras", "三平方の定理"], ["d3_similar", "相似比と面積比・体積比"], ["d3_inscribed", "円周角の定理"]]}, {"cat": "関数", "units": [["d3_ax2", "関数 y=ax²"], ["g3_ax2_graph", "関数 y=ax² のグラフ"]]}, {"cat": "データの活用", "units": [["d3_sample", "標本調査"]]}]}];
const $ = (id) => document.getElementById(id);
const el = (tag, props = {}, ...kids) => { const e = document.createElement(tag); Object.assign(e, props); e.append(...kids); return e; };
const store = {
  get(k, d) { try { const v = localStorage.getItem("pp:" + k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem("pp:" + k, JSON.stringify(v)); } catch {} },
};
const DOW = "日月火水木金土";
const pad = (n) => String(n).padStart(2, "0");
const iso = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const short = (k) => { const d = new Date(k + "T00:00"); return `${d.getMonth() + 1}/${d.getDate()}(${DOW[d.getDay()]})`; };

const unitName = {};
for (const g of UNITS) for (const c of g.cats) for (const [k, n] of c.units) unitName[k] = `${g.grade.replace("小学", "小").replace("中学", "中")} ${n}`;
let common = new Set(store.get("units", ["e5_frac_addsub", "w5_word", "g5_area"]).filter((k) => unitName[k]));
let perDay = store.get("perDay", {});
for (const k in perDay) perDay[k].units = perDay[k].units.filter((u) => unitName[u]);
const today = new Date(); today.setHours(0, 0, 0, 0);
const dates = new Set([iso(today)]);
let target = "common";
let grade = store.get("grade", "小学5年");
if (!UNITS.some((g) => g.grade === grade)) grade = UNITS[0].grade;

const save = () => { store.set("units", [...common]); store.set("perDay", perDay); };
const currentSet = () => (target !== "common" && perDay[target] ? new Set(perDay[target].units) : common);
function writeSet(s) { if (target !== "common" && perDay[target]) perDay[target].units = [...s]; else common = s; save(); }

// ---------- 日付 ----------
let view = new Date(today.getFullYear(), today.getMonth(), 1);
function renderCal() {
  $("month").textContent = `${view.getFullYear()}年${view.getMonth() + 1}月`;
  const grid = $("cal");
  grid.replaceChildren(...DOW.split("").map((d) => el("div", { className: "dow", textContent: d })));
  for (let i = 0; i < view.getDay(); i++) grid.append(el("div"));
  const n = new Date(view.getFullYear(), view.getMonth() + 1, 0).getDate();
  for (let d = 1; d <= n; d++) {
    const date = new Date(view.getFullYear(), view.getMonth(), d);
    const k = iso(date);
    const b = el("button", { type: "button", textContent: d });
    b.className = [date.getDay() % 6 === 0 ? "hol" : "", dates.has(k) ? "on" : "", k === iso(today) ? "today" : ""].join(" ");
    b.setAttribute("aria-pressed", dates.has(k) ? "true" : "false");
    b.setAttribute("aria-label", `${view.getMonth() + 1}月${d}日`);
    b.addEventListener("click", () => { if (dates.has(k)) dates.delete(k); else if (dates.size < 31) dates.add(k); renderDates(); });
    grid.append(b);
  }
}
function renderDates() {
  renderCal();
  const list = [...dates].sort();
  if (target !== "common" && !dates.has(target)) target = "common";
  $("dsum").textContent = list.length ? `${list.length} 日分` : "日付なしで1枚";
  $("dlist").replaceChildren(...list.map((k) => el("span", { className: perDay[k] ? "own" : "", textContent: short(k) + (perDay[k] ? "＊" : "") })));
  renderTarget();
  renderUnits();
}
$("prev").addEventListener("click", () => { view = new Date(view.getFullYear(), view.getMonth() - 1, 1); renderCal(); });
$("next").addEventListener("click", () => { view = new Date(view.getFullYear(), view.getMonth() + 1, 1); renderCal(); });
document.querySelectorAll("[data-q]").forEach((b) => b.addEventListener("click", () => {
  const q = b.dataset.q;
  dates.clear();
  if (q === "today") dates.add(iso(today));
  if (q === "week" || q === "nextweek") {
    const mon = new Date(today); mon.setDate(today.getDate() - ((today.getDay() + 6) % 7) + (q === "nextweek" ? 7 : 0));
    for (let i = 0; i < 5; i++) { const d = new Date(mon); d.setDate(mon.getDate() + i); dates.add(iso(d)); }
    view = new Date(mon.getFullYear(), mon.getMonth(), 1);
  }
  renderDates();
}));

// ---------- 出題範囲 ----------
function renderTarget() {
  const list = [...dates].sort();
  const box = $("target");
  box.hidden = list.length < 2;
  box.replaceChildren();
  const mk = (key, text) => {
    const b = el("button", { type: "button", textContent: text });
    b.setAttribute("aria-pressed", target === key ? "true" : "false");
    if (key !== "common" && perDay[key]) b.classList.add("own");
    b.addEventListener("click", () => { target = key; renderTarget(); renderUnits(); });
    box.append(b);
  };
  mk("common", "すべての日");
  list.forEach((k) => mk(k, short(k)));
  const bar = $("daybar");
  bar.hidden = target === "common" || box.hidden;
  if (bar.hidden) return;
  if (!perDay[target]) {
    bar.replaceChildren(el("span", { className: "grow", textContent: `${short(target)} は「すべての日」と同じ単元です。` }),
      el("button", { className: "btn sm", type: "button", textContent: "この日だけ選び直す", onclick: () => {
        perDay[target] = { units: [...common], count: null }; save(); renderDates();
      } }));
  } else {
    const cnt = el("input", { type: "number", id: "daycount", min: 1, max: 100, placeholder: $("count").value, value: perDay[target].count || "" });
    cnt.addEventListener("input", () => { const v = parseInt(cnt.value, 10); perDay[target].count = v >= 1 && v <= 100 ? v : null; save(); });
    bar.replaceChildren(el("span", { className: "grow", textContent: `${short(target)} だけの単元を選んでいます。` }),
      el("label", { htmlFor: "daycount", textContent: "問題数" }), cnt,
      el("button", { className: "link", type: "button", textContent: "元に戻す", onclick: () => { delete perDay[target]; save(); renderDates(); } }));
  }
}

function renderTabs() {
  const sel = currentSet();
  $("tabs").replaceChildren(...UNITS.map((g) => {
    const b = el("button", { type: "button", className: "tab", textContent: g.grade });
    b.setAttribute("role", "tab");
    b.setAttribute("aria-selected", g.grade === grade ? "true" : "false");
    const n = g.cats.flatMap((c) => c.units).filter(([k]) => sel.has(k)).length;
    if (n) b.append(el("span", { className: "cnt", textContent: `(${n})` }));
    b.addEventListener("click", () => { grade = g.grade; store.set("grade", grade); renderUnits(); });
    return b;
  }));
}

function renderUnits() {
  renderTabs();
  const sel = currentSet();
  $("cats").replaceChildren(...UNITS.find((x) => x.grade === grade).cats.map((c) => {
    const all = el("button", { type: "button", className: "link", textContent: "すべて" });
    all.addEventListener("click", () => {
      const s = currentSet();
      const on = c.units.every(([k]) => s.has(k));
      c.units.forEach(([k]) => (on ? s.delete(k) : s.add(k)));
      writeSet(s); renderUnits();
    });
    const fs = el("fieldset", {}, el("legend", {}, c.cat, all));
    for (const [key, name] of c.units) {
      const cb = el("input", { type: "checkbox", id: "u_" + key, checked: sel.has(key) });
      cb.addEventListener("change", () => { const s = currentSet(); cb.checked ? s.add(key) : s.delete(key); writeSet(s); renderTabs(); renderChosen(); });
      fs.append(el("label", { className: "unit" }, cb, el("span", { textContent: name })));
    }
    return fs;
  }));
  renderChosen();
}

function renderChosen() {
  const sel = currentSet();
  const box = $("chosen");
  const who = target === "common" ? "" : short(target) + "：";
  if (!sel.size) { box.replaceChildren(el("span", { className: "lbl", textContent: who + "まだ選ばれていません" })); return; }
  box.replaceChildren(el("span", { className: "lbl", textContent: `${who}${sel.size} 単元` }), ...[...sel].map((k) => {
    const b = el("button", { type: "button", className: "chip", title: "外す", textContent: unitName[k] + " ×" });
    b.addEventListener("click", () => { const s = currentSet(); s.delete(k); writeSet(s); renderUnits(); });
    return b;
  }), el("button", { type: "button", className: "link", textContent: "すべて外す", onclick: () => { writeSet(new Set()); renderUnits(); } }));
}

// ---------- 設定 ----------
const FIELDS = ["title", "count", "spacing", "output", "order"];
const CHECKS = ["sections", "shuffle"];
const saved = store.get("settings", {});
FIELDS.forEach((f) => { if (saved[f] !== undefined) $(f).value = saved[f]; });
CHECKS.forEach((f) => { if (saved[f] !== undefined) $(f).checked = !!saved[f]; });
function syncShuffle() { $("shuffle").disabled = $("sections").checked; }
syncShuffle();
FIELDS.concat(CHECKS).forEach((f) => $(f).addEventListener("change", () => {
  const s = {};
  FIELDS.forEach((k) => (s[k] = $(k).value));
  CHECKS.forEach((k) => (s[k] = $(k).checked));
  store.set("settings", s);
  syncShuffle();
}));

renderDates();

// ---------- PDF ----------
pdfjsLib.GlobalWorkerOptions.workerSrc = new URL("pdf.worker.min.js", location.href).href;
let py = null, lastPdf = null, lastName = "", downloads = null;
const inClaude = !!(window.claude && window.claude.use);
const FONTS = ["ipaexm.ttf", "KaTeX_Main-Regular.ttf", "KaTeX_Math-Italic.ttf"];
const setStatus = (text, err = false) => { const s = $("status"); s.textContent = text; s.classList.toggle("err", err); };

async function boot() {
  try {
    const b64 = async (url) => {
      const res = await fetch(url, { cache: "no-cache" });
      if (!res.ok) throw new Error(url + " " + res.status);
      const bin = atob((await res.text()).trim());
      const out = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
      return out;
    };
    const bin = async (url) => { const res = await fetch(url, { cache: "no-cache" }); if (!res.ok) throw new Error(url + " " + res.status); return new Uint8Array(await res.arrayBuffer()); };
    const [stdlib, buf, ...fonts] = await Promise.all([b64("pyodide/python_stdlib.b64.txt"), b64("py/bundle-7b70417305.b64.txt"), ...FONTS.map((f) => bin("fonts/" + f))]);
    const stdLibURL = URL.createObjectURL(new Blob([stdlib], { type: "application/zip" }));
    py = await loadPyodide({ indexURL: new URL("pyodide/", location.href).href, stdLibURL });
    py.unpackArchive(buf, "zip", { extractDir: "/app" });
    py.FS.mkdirTree("/app/worksheets/fonts");
    FONTS.forEach((f, i) => py.FS.writeFile("/app/worksheets/fonts/" + f, fonts[i]));
    py.runPython(`
import sys, json, datetime as dt
sys.path.insert(0, "/app")
from worksheets.sheets import make_days
from worksheets.pdf import build_pdf

def make(cfg):
    c = json.loads(cfg)
    ds = [dt.date.fromisoformat(d) for d in c["dates"]]
    days = make_days(c["units"], int(c["count"]), int(c["seed"]), ds, shuffle=c["shuffle"], per_day=c["per_day"])
    return build_pdf(days, title=c["title"], spacing=c["spacing"], output=c["output"],
                     answers_last=c["answers_last"], sections=c["sections"])
`);
    $("make").disabled = false;
    setStatus("準備ができました");
    make();
  } catch (e) {
    console.error(e);
    setStatus("起動できませんでした。ページを再読み込みしてください。（" + String(e.message || e).trim().split("\n").pop().slice(0, 120) + "）", true);
  }
}

async function make() {
  const list = [...dates].sort();
  const per_day = list.map((k) => (perDay[k] ? { units: perDay[k].units, count: perDay[k].count } : null));
  const empty = list.find((k, i) => per_day[i] && !per_day[i].units.length);
  if (empty) { setStatus(`${short(empty)} の単元を選んでください。`, true); target = empty; renderTarget(); renderUnits(); return; }
  const needCommon = !list.length || per_day.some((d) => !d);
  if (needCommon && !common.size) { setStatus("出題範囲を1つ以上選んでください。", true); return; }
  const count = parseInt($("count").value, 10);
  if (!(count >= 1 && count <= 100)) { setStatus("問題数は 1〜100 で入力してください。", true); return; }
  const title = $("title").value.trim() || "計算プリント";
  const seedIn = parseInt($("seed").value, 10);
  const seed = seedIn >= 1 && seedIn <= 999999 ? seedIn : 1 + Math.floor(Math.random() * 999999);
  const output = $("output").value;
  const sections = $("sections").checked;
  const cfg = { units: common.size ? [...common] : per_day.find((d) => d).units, count, seed, dates: list, per_day,
    shuffle: !sections && $("shuffle").checked, sections, title, spacing: $("spacing").value, output, answers_last: $("order").value === "last" };
  $("make").disabled = true;
  setStatus(list.length > 1 ? `${list.length} 日分を作成中…` : "作成中…");
  await new Promise((r) => setTimeout(r, 30));
  try {
    const fn = py.globals.get("make");
    const res = fn(JSON.stringify(cfg));
    lastPdf = res.toJs(); res.destroy(); fn.destroy();
    const suffix = { both: "", problems: "_問題", answers: "_解答" }[output];
    const span = list.length ? "_" + list[0].replaceAll("-", "") + (list.length > 1 ? "-" + list[list.length - 1].replaceAll("-", "") : "") : "";
    lastName = `${title}${suffix}${span}.pdf`.replace(/[\\/:*?"<>|]/g, "_");
    await render(lastPdf);
    setStatus(`できました（No.${String(seed).padStart(6, "0")}）`);
    if (!inClaude || downloads) { $("save").hidden = false; $("save").disabled = false; }
  } catch (e) {
    console.error(e);
    setStatus("作成できませんでした: " + String(e.message || e).split("\n").slice(-2).join(" "), true);
  } finally {
    $("make").disabled = false;
  }
}

async function render(bytes) {
  const doc = await pdfjsLib.getDocument({ data: bytes.slice() }).promise;
  const box = $("pages");
  const frag = document.createDocumentFragment();
  const width = Math.max(300, box.clientWidth - 24);
  const max = Math.min(doc.numPages, 40);
  for (let i = 1; i <= max; i++) {
    const page = await doc.getPage(i);
    const base = page.getViewport({ scale: 1 });
    const vp = page.getViewport({ scale: (width / base.width) * Math.min(window.devicePixelRatio || 1, 2) });
    const cv = el("canvas", { width: vp.width, height: vp.height });
    cv.setAttribute("aria-label", `${i}ページ目`);
    await page.render({ canvasContext: cv.getContext("2d"), viewport: vp }).promise;
    frag.append(cv);
  }
  box.replaceChildren(frag);
  box.scrollTop = 0;
  $("pinfo").textContent = doc.numPages > max ? `${doc.numPages} ページ（最初の${max}ページを表示）` : `${doc.numPages} ページ`;
}

$("make").addEventListener("click", () => { if (py) make(); });
$("save").addEventListener("click", async () => {
  if (!lastPdf) return;
  const blob = new Blob([lastPdf], { type: "application/pdf" });
  if (inClaude) {
    if (!downloads) return;
    try { await downloads.save({ filename: lastName, data: blob }); setStatus("ダウンロードしました"); }
    catch (e) {
      if (e && e.code === "declined") setStatus("ダウンロードをキャンセルしました");
      else if (e && e.code === "rate_limited") setStatus("少し待ってからもう一度押してください", true);
      else { setStatus("この画面ではダウンロードできません", true); $("save").hidden = true; }
    }
    return;
  }
  const url = URL.createObjectURL(blob);
  const a = el("a", { href: url, download: lastName });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
});

if (inClaude) {
  (async () => {
    try { downloads = await window.claude.use("downloads"); } catch { downloads = null; }
    if (downloads && lastPdf) { $("save").hidden = false; $("save").disabled = false; }
  })();
}
boot();
</script>

</body>
</html>
